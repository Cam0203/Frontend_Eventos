<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Power BI - CUL</title>
    <link rel="stylesheet" href="../css/base.css">
    <style>
        body {
            margin: 0;
            background: linear-gradient(135deg, #edf3fa 0%, #e6eef8 100%);
            font-family: "Segoe UI", Arial, sans-serif;
        }

        .powerbi-page {
            min-height: 100vh;
            padding: 28px;
        }

        .powerbi-header {
            background: white;
            border-radius: 22px;
            padding: 22px 28px;
            margin-bottom: 22px;
            box-shadow: 0 10px 30px rgba(13, 47, 115, 0.08);
        }

        .powerbi-header h1 {
            color: #0d2f73;
            margin-bottom: 6px;
        }

        .powerbi-header p {
            color: #627085;
        }

        .powerbi-frame-card {
            background: white;
            border-radius: 24px;
            padding: 18px;
            box-shadow: 0 18px 40px rgba(13, 47, 115, 0.12);
        }

        .powerbi-frame-card iframe {
            width: 100%;
            height: 78vh;
            border: none;
            border-radius: 18px;
            background: #f8fafc;
        }

        .btn-volver {
            display: inline-block;
            margin-bottom: 18px;
            background: #f5a623;
            color: white;
            padding: 12px 20px;
            border-radius: 999px;
            text-decoration: none;
            font-weight: 700;
        }

        @media screen and (max-width: 768px) {
            .powerbi-page {
                padding: 14px;
            }

            .powerbi-header {
                padding: 18px;
            }

            .powerbi-header h1 {
                font-size: 1.4rem;
            }

            .powerbi-frame-card iframe {
                height: 70vh;
            }
        }
    </style>
</head>
<body>

    <main class="powerbi-page">

        <a href="admin.html" class="btn-volver">← Volver al panel</a>

        <section class="powerbi-header">
            <h1>Dashboard Power BI</h1>
            <p>Visualización de indicadores y estadísticas del sistema de eventos académicos CUL.</p>
        </section>

        <section class="powerbi-frame-card">
            <iframe
                src="https://app.powerbi.com/reportEmbed?reportId=7ae82849-903a-4c03-b9b1-17e348214cc5&autoAuth=true&ctid=740be6bd-fd36-470e-94d9-0f0c777fadb9"
                allowFullScreen="true">
            </iframe>
        </section>

    </main>

</body>
</html>
